<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookLoft sklep testowy</title>
  <link rel="stylesheet" href="/test/assets/css/styles.css?v=1.01">
  <script defer src="/test/assets/js/store.js?v=1.01"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/test" aria-label="BookLoft sklep">
      <span class="brand-mark"><img src="/test/assets/img/logo.png?v=1.01" alt=""></span>
      <span>
        <strong>Sklep testowy</strong>
        <small>PRZESTRZEN PELNA KSIAZEK</small>
      </span>
    </a>
    <nav class="top-actions" aria-label="Nawigacja">
      <a href="/test/panel" class="ghost-action">Panel</a>
      <form method="post" action="/test/logout">
        <button type="submit" class="ghost-action">Wyloguj</button>
      </form>
    </nav>
  </header>

  <main class="shop-layout">
    <aside class="category-rail" aria-label="Kategorie">
      <div class="rail-head">
        <span>Kategorie</span>
        <button class="icon-action" id="clear-category" type="button" title="Wszystkie produkty" aria-label="Wszystkie produkty">x</button>
      </div>
      <div id="category-tree" class="category-tree"></div>
    </aside>

    <section class="shop-surface" aria-live="polite">
      <div class="shop-toolbar">
        <div>
          <p class="eyebrow">BookLoft / Base.com</p>
          <h1>Dostepne ksiazki</h1>
        </div>
        <div class="search-box">
          <label for="product-search">Szukaj</label>
          <input id="product-search" type="search" placeholder="Tytul, SKU, EAN">
        </div>
      </div>

      <div class="mobile-categories">
        <label for="category-select">Kategoria</label>
        <select id="category-select">
          <option value="">Wszystkie</option>
        </select>
      </div>

      <div class="category-chips" id="category-chips" aria-label="Szybkie kategorie"></div>

      <div class="status-strip" id="status-strip">
        <span>Ladowanie sklepu...</span>
      </div>

      <div class="product-grid" id="product-grid"></div>
      <button class="load-more" id="load-more" type="button" hidden>Pokaz wiecej</button>
      <div class="empty-state" id="empty-state" hidden>
        <h2>Brak produktow do pokazania</h2>
        <p>Sklep pokazuje tylko produkty dodane w panelu i majace stan magazynowy wiekszy od zera.</p>
      </div>
    </section>
  </main>
</body>
</html>
