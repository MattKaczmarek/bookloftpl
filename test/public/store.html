<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookLoft</title>
  <link rel="stylesheet" href="/test/assets/css/styles.css?v=1.01-cozy-4">
  <script defer src="/test/assets/js/store.js?v=1.01-cozy-4"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/test" aria-label="BookLoft sklep">
      <span class="brand-mark"><img src="/test/assets/img/logo-mark.png?v=1.01" alt=""></span>
      <span class="brand-word">BookLoft</span>
    </a>
    <nav class="top-actions" aria-label="Nawigacja">
      <a href="/test/panel" class="ghost-action">Panel</a>
      <form method="post" action="/test/logout">
        <button type="submit" class="ghost-action">Wyloguj</button>
      </form>
    </nav>
  </header>

  <main class="shop-layout">
    <aside class="category-rail" aria-label="Kategorie">
      <div class="rail-head">
        <span>Kategorie</span>
        <button class="icon-action" id="clear-category" type="button" title="Wszystkie produkty" aria-label="Wszystkie produkty">x</button>
      </div>
      <div id="category-tree" class="category-tree"></div>
    </aside>

    <section class="shop-surface" aria-live="polite">
      <div class="shop-toolbar">
        <div class="shop-intro">
          <p class="eyebrow">BookLoftowy regał</p>
          <h1>Znajdź kolejną historię</h1>
          <p class="hero-copy">Książki z drugiego obiegu do herbaty, świecy i wieczoru z dobrym rozdziałem.</p>
        </div>
        <div class="shop-hero-side">
          <div class="search-box">
            <label for="product-search">Szukaj</label>
            <input id="product-search" type="search" placeholder="Tytuł, autor, seria">
          </div>
        </div>
      </div>

      <div class="mobile-categories">
        <label for="category-select">Kategoria</label>
        <select id="category-select">
          <option value="">Wszystkie</option>
        </select>
      </div>

      <div class="category-chips" id="category-chips" aria-label="Szybkie kategorie"></div>

      <div class="status-strip" id="status-strip">
        <span>Ładowanie regału...</span>
      </div>

      <div class="product-grid" id="product-grid"></div>
      <button class="load-more" id="load-more" type="button" hidden>Pokaż więcej</button>
      <div class="empty-state" id="empty-state" hidden>
        <h2>Na tym regale nic nie ma</h2>
        <p>Spróbuj innej kategorii albo krótszego wyszukiwania.</p>
      </div>
    </section>
  </main>
</body>
</html>
